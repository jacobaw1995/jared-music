<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runnin' — Jared Walker</title>
  <meta property="og:title" content="Runnin' — Jared Walker" />
  <meta property="og:description" content="Out now on Apple Music, Spotify, Amazon Music & YouTube." />
  <meta property="og:image" content="https://jcountrymusic.com/assets/photos/jared-header.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Inter:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #C9A84C;
      --gold-lt: #E8C96A;
      --cream:   #F5EDD8;
      --dark:    #0D0B08;
      --mid:     #1A1510;
      --dim:     #8A7A60;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* noise */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: .35;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 48px;
      background: linear-gradient(to bottom, rgba(13,11,8,.95) 0%, transparent 100%);
    }
    nav.scrolled {
      background: rgba(13,11,8,.97);
      border-bottom: 1px solid rgba(201,168,76,.15);
    }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo img { height: 34px; filter: invert(1) sepia(1) brightness(1.35) saturate(1.2); opacity: .9; }
    .nav-back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dim);
      text-decoration: none;
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: color .2s;
    }
    .nav-back:hover { color: var(--gold); }
    .nav-back svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── BG ── */
    .page-bg {
      position: fixed;
      inset: 0;
      background-image: url('/assets/photos/jared-header.jpg');
      background-size: cover;
      background-position: center 25%;
      z-index: -1;
    }
    .page-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(13,11,8,.85) 0%,
        rgba(13,11,8,.7) 30%,
        rgba(13,11,8,.88) 70%,
        rgba(13,11,8,.98) 100%
      );
    }

    /* ── MAIN ── */
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
      position: relative;
      z-index: 1;
    }

    .release-wrap {
      text-align: center;
      max-width: 680px;
      width: 100%;
    }

    .release-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: .62rem;
      font-weight: 600;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }
    .release-eyebrow::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    .release-artist {
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 12px;
    }

    .release-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 20vw, 10rem);
      letter-spacing: .04em;
      line-height: .9;
      color: var(--cream);
      text-shadow: 0 0 80px rgba(201,168,76,.2);
      margin-bottom: 8px;
    }

    .release-date {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--dim);
      margin-bottom: 56px;
    }

    /* divider */
    .release-divider {
      width: 60px;
      height: 1px;
      background: rgba(201,168,76,.4);
      margin: 0 auto 56px;
    }

    /* platform buttons */
    .platforms {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .platform-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 28px;
      text-decoration: none;
      border: 1px solid rgba(245,237,216,.12);
      background: rgba(13,11,8,.6);
      color: var(--cream);
      font-size: .82rem;
      font-weight: 500;
      letter-spacing: .08em;
      transition: all .2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .platform-btn:hover {
      border-color: var(--gold);
      background: rgba(201,168,76,.08);
      color: var(--cream);
      transform: translateX(4px);
    }
    .platform-btn .p-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .platform-btn .p-icon svg { width: 18px; height: 18px; fill: #fff; }
    .platform-btn .p-name { flex: 1; text-align: left; }
    .platform-btn .p-arrow {
      width: 16px; height: 16px;
      fill: var(--dim);
      transition: fill .2s, transform .2s;
      flex-shrink: 0;
    }
    .platform-btn:hover .p-arrow { fill: var(--gold); transform: translateX(3px); }

    /* platform icon colors */
    .p-apple  { background: #000; }
    .p-spotify { background: #1DB954; }
    .p-amazon { background: #FF9900; }
    .p-youtube { background: #FF0000; }

    /* back link bottom */
    .back-bottom {
      margin-top: 56px;
      font-size: .72rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .back-bottom a {
      color: var(--dim);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color .2s;
    }
    .back-bottom a:hover { color: var(--gold); }
    .back-bottom svg { width: 12px; height: 12px; fill: currentColor; }

    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      .release-title { font-size: clamp(4rem, 22vw, 7rem); }
      .platform-btn { padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <nav id="nav">
    <a href="/" class="nav-logo">

    </a>
    <a href="/" class="nav-back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Back to Site
    </a>
  </nav>

          </div>
          <span class="p-name">Spotify</span>
          <svg class="p-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
        </a>

        <a class="platform-btn" href="https://music.amazon.com/albums/B0GZB4TLGK?marketplaceId=ATVPDKIKX0DER&musicTerritory=US&ref=dm_sh_YGvjAKd6mTlSmjQ9TVeQc1Tv9&trackAsin=B0GZ9XC325" target="_blank">

          </div>
          <span class="p-name">Amazon Music</span>
          <svg class="p-arrow" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>

        <a class="platform-btn" href="https://youtu.be/SSXVWBT8its?si=woZkC7HUWujhjFlx" target="_blank">

      </div>

      <div class="back-bottom">
        <a href="/">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Back to jcountrymusic.com
        </a>
      </div>

    </div>
  </main>

  <script>
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 40));
  </script>

</body>
</html>
